events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;

    # Upstream services
    upstream nextjs {
        server portfolio:3000;
    }

    upstream webapps {
        server webapps:8501;
    }

    # Redirect HTTP (Port 80) ke HTTPS (Port 443) secara otomatis
    server {
        listen 80;
        server_name vibedims.id www.vibedims.id;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name vibedims.id www.vibedims.id;

        # Let's Encrypt SSL Certificates (dimount dari Host VPS)
        ssl_certificate /etc/letsencrypt/live/vibedims.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vibedims.id/privkey.pem;

        # Optimasi SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Client max body size (berguna untuk upload file besar di Streamlit)
        client_max_body_size 200M;

        # ─── Streamlit Web Apps ─────────────────────────────
        location /webapps/ {
            proxy_pass http://webapps/webapps/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # ─── Shortcut: Extract SDA ───────────────────────────
        location /apps/extract-sda {
            return 301 /webapps/1_Extract_SDA;
        }

        # ─── Shortcut: MSTower Geometry Viewer ───────────────
        location /apps/mstower {
            return 301 /webapps/2_Geometry_Viewer;
        }

        # ─── Shortcut: Shifting Checker ──────────────────────
        location /apps/shifting-checker {
            return 301 /webapps/3_Shifting_Checker;
        }

        # ─── Next.js Portfolio (catch-all) ──────────────────────────
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
